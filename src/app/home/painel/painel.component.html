<section class="painel-tv-wrapper">
  <div class="container-fluid h-100 p-0">
    
    <div class="row m-0 h-100">
      
      <div class="col-md-7 d-flex align-items-center justify-content-center p-4">
        <div class="chamada-principal card-glass shadow-lg w-100 text-center py-5">
          
          <ng-container *ngIf="psenha && pguiche">
            <span class="label-superior">{{ pguiche === pconsultorio ? 'PACIENTE' : 'SENHA' }}</span>
            <h1 class="valor-principal piscar-suave">{{ psenha }}</h1>

            <div class="divisor-horizontal my-4"></div>

            <span class="label-superior">{{ pguiche !== '00' ? (pguiche === pconsultorio ? 'CONSULTÓRIO' : 'GUICHÊ') : '' }}</span>
            <h1 class="valor-secundario">{{ pguiche }}</h1>
          </ng-container>

          <div *ngIf="ativarPainel" class="mt-4">
            <button class="btn btn-danger btn-lg px-5 py-3 shadow" (click)="ativar()">
              Clique para Ativar o Painel
            </button>
          </div>
        </div>
      </div>

      <div class="col-md-5 d-flex flex-column p-4 background-dark-glass">
        <div class="header-historico mb-4">
          <h2 class="titulo-historico">ÚLTIMAS CHAMADAS</h2>
        </div>

        <div class="historico-lista custom-scroll flex-grow-1">
          <div class="row g-3">
            <div class="col-12" *ngFor="let senha of senhasChamadas$ | async">
              <div class="card-historico shadow-sm">
                
                <ng-container *ngIf="senha.nome && senha.consultorio; else convencional">
                  <div class="d-flex justify-content-between align-items-center">
                    <div class="info">
                      <small class="text-info d-block">PACIENTE</small>
                      <span class="nome-historico">{{ senha.nome }}</span>
                    </div>
                    <div class="local text-end">
                      <small class="text-white-50 d-block">CONSULTÓRIO</small>
                      <span class="numero-historico">{{ senha.consultorio }}</span>
                    </div>
                  </div>
                </ng-container>

                <ng-template #convencional>
                  <div class="d-flex justify-content-between align-items-center">
                    <div class="info">
                      <small class="text-info d-block">SENHA</small>
                      <span class="nome-historico">{{ senha.senha }}</span>
                    </div>
                    <div class="local text-end">
                      <small class="text-white-50 d-block">GUICHÊ</small>
                      <span class="numero-historico">{{ senha.guiche }}</span>
                    </div>
                  </div>
                </ng-template>

              </div>
            </div>
          </div>
        </div>

       <!-- <div class="logo-container mt-auto pt-4 text-center">
          <img src="./assets/img/logohumanitas.png" class="logo-img" />
        </div>-->
      </div>

    </div>
  </div>
</section>
