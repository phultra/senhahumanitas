<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
  <p style="font-size: 20px; color: white">Chamando Senha...</p>
</ngx-spinner>

<section *ngIf="telaoperador" class="main-op-dashboard">
  <div class="container-fluid pt-4 px-4">
    <div class="row align-items-center mb-4">
      <div class="col-md-6 text-start">
        <h5 class="text-white-50 mb-0">OPERADOR(A)</h5>
        <h2 class="text-white fw-bold">{{nomeUsuario}}</h2>
        <h6 class="text-white-50 mb-0">Guichê:</h6>
        <h4 class="text-white fw-bold">{{guiche}}</h4>
      </div>
      <div class="col-md-2 text-md-end text-center mt-3 mt-md-0">
        <button class="btn btn-primary btn-lg px-5 shadow-lg" (click)="chamarSenhaConvencional()">
          CHAMAR PRÓXIMA
        </button>
      </div>
      <div class="col-md-3 text-md-end text-center mt-3 mt-md-0">
        <button class="btn btn-secondary btn-lg px-5 shadow-lg" (click)="irparaverificasenha()">
          VERIFICAR ATENDIDAS
        </button>
      </div>
      <div class="col-md-1 text-md-end text-center mt-3 mt-md-0">
        <button class="btn btn-danger btn-lg px-5 shadow-lg" (click)="sair()">
          SAIR
        </button>
      </div>
      
    </div>

    <div class="row g-4">
      <div class="col-xl-3 col-lg-4">
        <div class="card-glass shadow-sm">
          <div class="card-header-glass">SENHAS DISPONÍVEIS</div>
          <div class="queue-list custom-scroll">
            <ul class="list-unstyled p-3">
              <li *ngFor="let senha of senhasDisponiveis" class="mb-2">
                <button 
                  class="btn w-100 senhasdisponiveis text-start d-flex justify-content-between align-items-center p-3" 
                  [ngClass]="{
                    'senha-consulta': senha.setor === 'CONSULTA',
                    'senha-agendamento': senha.setor === 'REALIZAR AGENDAMENTO',
                    'senha-exames': senha.setor === 'EXAME',
                    'senha-resultado': senha.setor === 'RESULTADO DE EXAMES',
                    'senha-marcapasso': senha.setor === 'AVALIAÇÃO DE MARCAPASSO'
                  }"
                  (click)="chamarSenhaConvencional(senha)">
                  <span class="fw-bold">{{ senha.senha }}</span>
                  <small style="font-size: 0.9rem; opacity: 0.8;">{{ senha.setor }}</small>
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <div class="col-xl-6 col-lg-8">
        <div class="card-main-atendimento shadow-lg text-center p-4 p-md-5">
          <h4 class="text-white-50 mb-4">EM ATENDIMENTO</h4>
          
          <div class="display-senha-box my-4">
            <h1 class="senha-texto-grande">{{senhaOperadorPainel.senha || '---'}}</h1>
          </div>

          <div class="row g-2 justify-content-center mt-4" *ngIf="senhaOperadorPainel.status === '1'">
            <div class="col-md-4">
              <button class="btn btn-info w-100 py-3 fw-bold" (click)="repetirsenha(senhaOperadorPainel)">
                REPETIR SENHA
              </button>
            </div>
            <div class="col-md-4">
              <button class="btn btn-success w-100 py-3 fw-bold" (click)="finalizarConvencional(senhaOperadorPainel)">
                FINALIZAR
              </button>
            </div>
            <div class="col-md-4">
              <button class="btn btn-warning w-100 py-3 fw-bold text-dark" (click)="naoCompareceu(senhaOperadorPainel)">
                NÃO COMPARECEU
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-xl-3 col-lg-12">
        <div 
          *ngIf="(senhaOperadorPainel.setor === 'CONSULTA' || senhaOperadorPainel.setor === 'EXAME' || senhaOperadorPainel.setor === 'REALIZAR AGENDAMENTO' || senhaOperadorPainel.setor === 'AVALIAÇÃO DE MARCAPASSO') && senhaOperadorPainel.status !== '3'" 
          class="card-glass p-4"
        >
          <h5 class="text-white border-bottom pb-2 mb-3">Dados do Paciente</h5>
          <div class="mb-3">
            <label class="text-white-50 small mb-1">Nome do Paciente</label>
            <input class="form-control bg-white" [(ngModel)]="dadosPaciente.nome" placeholder="Nome completo">
          </div>
          <div class="mb-3">
            <label class="text-white-50 small mb-1">Nome do Médico</label>
            <select class="form-select bg-white" [(ngModel)]="dadosPaciente.medico">
              <option *ngFor="let medico of medicos" [value]="medico.nome">{{ medico.nome }}</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section *ngIf="!telaoperador" class="main-op-dashboard d-flex align-items-center justify-content-center">
  <div class="login-card p-5 shadow-lg">
    <div class="text-center mb-4">
      <img src="./assets/img/logouai.png" class="img-fluid mb-3" style="max-height: 80px;">
      <h3 class="text-white fw-bold">Acesso ao Guichê</h3>
    </div>

    <form [formGroup]="formulario" (ngSubmit)="cadastrarConvencional()">
      <div class="mb-4 text-center">
        <label class="text-white-50 d-block mb-2">Informe seu Guichê:</label>
        <select formControlName="guiche" class="form-select text-center fw-bold fs-4 shadow-none">
          <option *ngFor="let n of ['01','02','03','04','05','06','07','08','09','10']" [value]="n">{{n}}</option>
        </select>
      </div>

      <div class="mb-4 text-center">
        <label class="text-white-50 d-block mb-2">Nome do Operador:</label>
        <input class="form-control text-center bg-transparent text-white border-0 fs-5 shadow-none" 
               formControlName="nome" [value]="nomeUsuario" readonly />
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">ENTRAR</button>
    </form>
  </div>
</section>
