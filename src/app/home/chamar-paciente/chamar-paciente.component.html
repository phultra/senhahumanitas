<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
  <p style="font-size: 20px; color: white">Chamando Paciente...</p>
</ngx-spinner>

<section *ngIf="telaoperador" class="painel-medico">
  <div class="container-fluid pt-4 px-4">
    
    <div class="row align-items-center mb-5 header-container">
      <div class="col-md-8 text-start">
        <span class="badge-medico">MÉDICO(A) EM ATENDIMENTO</span>
        <h1 class="nome-medico">{{operador}}</h1>
      </div>
      <div class="col-md-4 text-md-end text-center">
        <div class="consultorio-pill">
          CONSULTÓRIO {{guiche}}
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-12">
        <h4 class="text-white-50 mb-3 fs-6 fw-bold">FILA DE PACIENTES AGUARDANDO</h4>
      </div>
      
      <div *ngFor="let senha of senhasDisponiveis" class="col-12 mb-2">
        <div class="card-paciente shadow-sm" [ngClass]="{'atendimento-ativo': senha.status === '2'}">
          <div class="row align-items-center p-3">
            
            <div class="col-md-4">
              <small class="d-block text-muted fw-bold">PACIENTE</small>
              <span class="nome-paciente">{{ senha.nome }}</span>
            </div>

            <div class="col-md-8">
              <div class="d-flex flex-wrap gap-2 justify-content-md-end justify-content-center mt-3 mt-md-0">
                
                <button *ngIf="senha.status ==='3'" class="btn btn-call" (click)="chamarSenhaConvencional(senha)">
                  CHAMAR PACIENTE
                </button>

                <button *ngIf="senha.status ==='1'" class="btn btn-warning-custom shadow-none cursor-default">
                  CHAMANDO PACIENTE...
                </button>

                <ng-container *ngIf="senha.status ==='2'">
                  <button class="btn btn-status-active">EM ATENDIMENTO</button>
                  <button class="btn btn-outline-info-custom" (click)="repetirsenha(senha)">
                    REPETIR CHAMADA
                  </button>
                  <button class="btn btn-success-custom" (click)="finalizarConvencional(senha)">
                    FINALIZAR ATENDIMENTO
                  </button>
                  <button class="btn btn-danger-custom" (click)="naoCompareceu(senha)">
                    AUSENTE
                  </button>
                </ng-container>

              </div>
            </div>

          </div>
        </div>
      </div>

      <div *ngIf="senhasDisponiveis?.length === 0" class="col-12 text-center py-5">
        <p class="text-white-50">Não há pacientes na fila de espera.</p>
      </div>
    </div>
  </div>
</section>

<section *ngIf="!telaoperador" class="painel-medico d-flex align-items-center justify-content-center">
  <div class="login-card-medico p-5 shadow-lg">
    <div class="text-center mb-4">
      <img src="./assets/img/logouai.png" class="img-fluid mb-4" style="max-height: 70px;">
      <h4 class="text-white fw-bold">Acesso ao Consultório</h4>
    </div>

    <form [formGroup]="formulario" (ngSubmit)="cadastrarConvencional()">
      <div class="mb-4">
        <label class="label-login">Selecione o Consultório</label>
        <select formControlName="guiche" class="form-select select-custom">
          <option *ngFor="let consultorio of consultorios" [value]="consultorio.numero">
            Consultório {{ consultorio.numero }}
          </option>
        </select>
      </div>

      <div class="mb-4">
        <label class="label-login">Selecione o Médico</label>
        <select formControlName="nome" class="form-select select-custom">
          <option *ngFor="let medico of medicos" [value]="medico.nome">
            {{ medico.nome }}
          </option>
        </select>
      </div>

      <button type="submit" class="btn btn-entrar-medico w-100 fw-bold py-3">
        ACESSAR PAINEL
      </button>
    </form>
  </div>
</section>
