<section class="admin-wrapper">
  <app-menu></app-menu>

  <div class="container py-4">
    <div class="row justify-content-center mb-5">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="form-card">
          <h2>Cadastro de Médico</h2>
          <form (ngSubmit)="salvarMedico()" class="d-flex flex-column gap-3">
            <div class="text-start">
              <label for="nome" class="form-label">Nome do Médico:</label>
              <input
                type="text"
                id="nome"
                [(ngModel)]="nome"
                name="nome"
                class="form-control custom-input"
                placeholder="Ex: Dr. João Silva"
                required
              />
            </div>
            <button type="submit" class="btn-save">Salvar Médico</button>
          </form>
        </div>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="table-card">
          <h3 class="text-white mb-4">Médicos Cadastrados</h3>
          <div class="table-responsive custom-scroll">
            <table class="table table-custom">
              <thead>
                <tr>
                  <th>Nome do Profissional</th>
                  <th class="text-center">Ações</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let medico of medicos">
                  <td class="fw-bold">{{ medico.nome }}</td>
                  <td class="text-center">
                    <button (click)="excluirmedico(medico)" class="btn-delete">
                      <i class="bi bi-trash"></i> Excluir
                    </button>
                  </td>
                </tr>
                <tr *ngIf="medicos.length === 0">
                  <td colspan="2" class="text-muted text-center">Nenhum médico cadastrado.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
