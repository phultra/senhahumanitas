<section class="admin-section">
  <app-menu></app-menu>
  
  <div class="container py-4">
    <div class="row">
      <div class="col-12 text-center mb-5">
        <h2 class="text-white">Painel Administrativo</h2>
        <p class="text-info">Versão 1.03</p>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-10"> <div class="card-painel mb-5">
          <h3 class="text-white mb-3">Usuários Cadastrados</h3>
          <div class="table-responsive">
            <table class="table table-custom">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Email</th>
                  <th>Função</th>
                  <th class="text-center">Ações</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let usuario of usuariosSalvos">
                  <td>{{ usuario.nome }}</td>
                  <td>{{ usuario.email }}</td>
                  <td>{{ usuario.funcao }}</td>
                  <td class="text-center">
                    <button *ngIf="usuario" (click)="excluirUsuario(usuario)" class="btn btn-outline-danger btn-sm">
                      Excluir
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="card-painel mb-5">
          <h3 class="text-white mb-3">Senhas em Chamada</h3>
          <div class="table-responsive">
            <table class="table table-custom">
              <thead>
                <tr>
                  <th>Senha</th>
                  <th>Operador/Médico</th>
                  <th>Setor</th>
                  <th class="text-center">Apagar</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of senhasChamada">
                  <td class="fw-bold">{{ item.senha }}</td>
                  <td>{{ item.operadorOuMedico }}</td>
                  <td>{{ item.setor }}</td>
                  <td class="text-center">
                    <button class="btn btn-danger btn-sm" (click)="apagarSenhaChamada(item)">
                      Remover
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
            <button class="btn btn-danger" (click)="apagarTodasSenhasChamada()">
              Apagar TODAS as Senhas
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
